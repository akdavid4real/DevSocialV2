apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: devsocial
# Only the frontend runs in the disposable lab. Its API stays on Render.
# This avoids copying database credentials into the playground.
resources:
  - ../base/namespace.yaml
  - ../base/frontend.yaml
patches:
  - target: {kind: Deployment, name: frontend}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/env/0
        value:
          name: API_UPSTREAM
          valueFrom:
            configMapKeyRef: {name: render-api, key: url}
  - target: {kind: Service, name: frontend}
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
