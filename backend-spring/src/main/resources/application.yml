server:
  port: ${PORT:3001}
  servlet:
    context-path: /api/v2
  shutdown: graceful

spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: devsocial-backend-spring
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  lifecycle:
    timeout-per-shutdown-phase: 45s
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

devsocial:
  cors:
    origins: ${CORS_ORIGINS:${FRONTEND_URL:http://localhost:5173}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
