name: devsocial

services:
  backend:
    build:
      context: ./backend-spring
    image: devsocial-backend:local
    env_file:
      - ./backend-spring/.env
    environment:
      PORT: "3001"
      # Local HTTP needs non-secure auth cookies. The image itself defaults to production.
      NODE_ENV: development
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      AUTH_COOKIE_SAME_SITE: lax
    ports:
      - "127.0.0.1:3001:3001"
    init: true

  frontend:
    environment:
      API_UPSTREAM: http://backend:3001
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v2
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Set VITE_SUPABASE_URL in .env.docker}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?Set VITE_SUPABASE_ANON_KEY in .env.docker}
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY:-}
    image: devsocial-frontend:local
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      backend:
        condition: service_healthy
